<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextUtsav Full Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #09090b; display: flex; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .split-view { display: flex; width: 100%; height: 100%; }
        .web-view { flex: 2; border-right: 2px solid #27272a; }
        .mobile-view { flex: 1; display: flex; justify-content: center; align-items: center; background: #18181b; }
        iframe { width: 100%; height: 100%; border: none; }
        .overlay { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 99px; font-weight: bold; border: 1px solid #3f3f46; }
    </style>
</head>
<body>
    <div class="split-view">
        <div class="web-view">
            <iframe src="http://localhost:3000/login"></iframe>
        </div>
        <div class="mobile-view">
            <div style="transform: scale(0.85);">
                <iframe src="demo_phone.html" style="width: 375px; height: 812px; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);"></iframe>
            </div>
        </div>
    </div>
    <div class="overlay">Live Sync Demo: Web Admin ↔ Mobile App</div>
</body>
</html>
